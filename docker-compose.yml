services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5433:5432"  # 5433 on the host so it does not clash with a local Postgres on 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://rag:rag@db:5432/rag
      # Ollama runs on your machine (not in Docker); host.docker.internal reaches it.
      # Own variable name on purpose: compose also reads .env, and LLM_BASE_URL=localhost from there
      # would point at the container itself.
      LLM_BASE_URL: ${DOCKER_LLM_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      LLM_MODEL: ${LLM_MODEL:-qwen2.5:7b}
    extra_hosts:
      - "host.docker.internal:host-gateway"  # needed on Linux, harmless on Mac/Windows
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - hf_cache:/root/.cache/huggingface  # keeps the downloaded embedding model between restarts
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  hf_cache:
